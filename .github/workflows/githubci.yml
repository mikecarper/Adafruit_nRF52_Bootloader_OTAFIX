name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]
  release:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set matrix
        id: set-matrix
        working-directory: src/boards
        run: |
          MATRIX_JSON=$(ls -d */ | sed 's/\/$//' | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true

    - name: Install ARM GCC
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '14.2.Rel1'

    - name: Install Tools
      run: |
        pip3 install adafruit-nrfutil uritemplate requests intelhex setuptools

    - name: Build
      shell: bash
      run: |
        mota_make_args=()
        mota_cmake_args=()
        if [[ "$GITHUB_EVENT_NAME" != "release" ]]; then
          mota_make_args=(MOTA_BOOTLOADER_TEST_BUILD=1 MOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=0x02040302)
          mota_cmake_args=(-DMOTA_BOOTLOADER_TEST_BUILD=ON -DMOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=0x02040302)
        fi

        make BOARD=${{ matrix.board }} "${mota_make_args[@]}" all
        make BOARD=${{ matrix.board }} "${mota_make_args[@]}" copy-artifact
        cmake -S . -B cmake-build-${{ matrix.board }} -DBOARD=${{ matrix.board }} \
          "${mota_cmake_args[@]}"
        cmake --build cmake-build-${{ matrix.board }}

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.board }}
        path: _bin/${{ matrix.board }}

  feature-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Install Tools
        run: |
          pip3 install adafruit-nrfutil uritemplate requests intelhex setuptools

      - name: Run host tests
        run: |
          make -C test check
          make -C test sanitize

      - name: Build signed and dual-bank display variants
        shell: bash
        run: |
          mota_make_args=()
          mota_cmake_args=()
          if [[ "$GITHUB_EVENT_NAME" != "release" ]]; then
            mota_make_args=(MOTA_BOOTLOADER_TEST_BUILD=1 MOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=0x02040302)
            mota_cmake_args=(-DMOTA_BOOTLOADER_TEST_BUILD=ON -DMOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=0x02040302)
          fi

          QX=0x6b,0x17,0xd1,0xf2,0xe1,0x2c,0x42,0x47,0xf8,0xbc,0xe6,0xe5,0x63,0xa4,0x40,0xf2,0x77,0x03,0x7d,0x81,0x2d,0xeb,0x33,0xa0,0xf4,0xa1,0x39,0x45,0xd8,0x98,0xc2,0x96
          QY=0x4f,0xe3,0x42,0xe2,0xfe,0x1a,0x7f,0x9b,0x8e,0xe7,0xeb,0x4a,0x7c,0x0f,0x9e,0x16,0x2b,0xce,0x33,0x57,0x6b,0x31,0x5e,0xce,0xcb,0xb6,0x40,0x68,0x37,0xbf,0x51,0xf5
          for board in heltec_t096 heltec_t114; do
            make BOARD="$board" BUILD="_build/signed-$board" SIGNED_FW=1 \
              SIGNED_FW_QX="$QX" SIGNED_FW_QY="$QY" "${mota_make_args[@]}" all
            make BOARD="$board" BUILD="_build/dualbank-$board" DUALBANK_FW=1 \
              "${mota_make_args[@]}" all

            cmake -S . -B "cmake-build-signed-$board" -DBOARD="$board" \
              -DSIGNED_FW=ON -DSIGNED_FW_QX="$QX" -DSIGNED_FW_QY="$QY" \
              "${mota_cmake_args[@]}"
            cmake --build "cmake-build-signed-$board"
            cmake -S . -B "cmake-build-dualbank-$board" -DBOARD="$board" \
              -DDUALBANK_FW=ON "${mota_cmake_args[@]}"
            cmake --build "cmake-build-dualbank-$board"
          done

  bootloader-mota:
    if: ${{ github.event_name == 'release' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout pinned motatool
        uses: actions/checkout@v7
        with:
          repository: mikecarper/motatool
          ref: 11f67eef8f1dffba9cbb7d102777cc7134be3821
          path: _motatool

      - name: Download bootloader artifacts
        uses: actions/download-artifact@v7
        with:
          path: _release
          merge-multiple: true

      - name: Build motatool
        run: cargo build --release --locked --manifest-path _motatool/Cargo.toml

      - name: Build signed bootloader mOTA bundle
        shell: bash
        env:
          OTAFIX_MOTA_SIGNING_KEY: ${{ secrets.OTAFIX_MOTA_SIGNING_KEY }}
        run: |
          if [[ -z "$OTAFIX_MOTA_SIGNING_KEY" ]]; then
            echo "OTAFIX_MOTA_SIGNING_KEY repository secret is required" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/otafix-mota-signing.key"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$OTAFIX_MOTA_SIGNING_KEY" > "$key_file"
          unset OTAFIX_MOTA_SIGNING_KEY
          python3 tools/build_bootloader_mota_release.py \
            --artifacts-dir _release \
            --output-dir _mota-release \
            --motatool _motatool/target/release/motatool \
            --sign-key "$key_file" \
            --public-key tools/otafix_mota_release.pub \
            --tag "$GITHUB_REF_NAME"
          install -m 755 tools/otafix_mota_update.py \
            _mota-release/otafix_mota_update.py
          sha256sum _mota-release/otafix_mota_update.py > \
            _mota-release/otafix_mota_update.py.sha256

      - name: Upload bootloader mOTA release bundle
        uses: actions/upload-artifact@v7
        with:
          name: bootloader-mota-release
          path: |
            _mota-release/*.zip
            _mota-release/*.txt
            _mota-release/*.sha256
            _mota-release/*.py

  release:
    if: ${{ github.event_name == 'release' }}
    needs: [build, feature-builds, bootloader-mota]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: _release
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            _release/*.zip
            _release/*.hex
            _release/*.uf2
            _release/*.txt
            _release/*.sha256
            _release/*.py

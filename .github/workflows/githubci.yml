name: Build

on:
  workflow_dispatch:
    inputs:
      release_build:
        description: Build signed production artifacts from an exact tag without publishing
        type: boolean
        default: false
  pull_request:
  push:
    branches: [ master, feature/ota-delta-apply ]
  release:
    types:
      - created

permissions:
  contents: read

env:
  # 0x02040401 identifies the failed global TinyUSB-budget candidate.
  # 0x02040A05 identifies restored recovery information qualification, not a release.
  OTAFIX_QUALIFICATION_VERSION: '0x02040A05'
  OTAFIX_RELEASE_BUILD: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_build) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-matrix:
    if: ${{ !startsWith(github.ref_name, 'R_') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require an exact clean production tag
        if: ${{ env.OTAFIX_RELEASE_BUILD == 'true' }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$(git describe --dirty --always --tags)" = "$GITHUB_REF_NAME"
          python3 tools/derive_otafix_version.py "$GITHUB_REF_NAME" --hex

      - name: Set matrix
        id: set-matrix
        working-directory: src/boards
        run: |
          MATRIX_JSON=$(ls -d */ | sed 's/\/$//' | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true

    - name: Install ARM GCC
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '14.2.Rel1'

    - name: Set reproducible build timestamp
      run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

    - name: Install Tools
      run: |
        pip3 install adafruit-nrfutil cryptography uritemplate requests intelhex setuptools

    - name: Build
      shell: bash
      run: |
        mota_make_args=()
        mota_cmake_args=()
        if [[ "$OTAFIX_RELEASE_BUILD" != "true" ]]; then
          if [[ ! "$OTAFIX_QUALIFICATION_VERSION" =~ ^0x[0-9A-Fa-f]{8}$ || "$OTAFIX_QUALIFICATION_VERSION" == "0x02040401" ]]; then
            echo "invalid OTAFIX qualification version: $OTAFIX_QUALIFICATION_VERSION" >&2
            exit 1
          fi
          mota_make_args=(MOTA_BOOTLOADER_TEST_BUILD=1 "MOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=$OTAFIX_QUALIFICATION_VERSION")
          mota_cmake_args=(-DMOTA_BOOTLOADER_TEST_BUILD=ON "-DMOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=$OTAFIX_QUALIFICATION_VERSION")
        fi

        make BOARD=${{ matrix.board }} "${mota_make_args[@]}" all
        make BOARD=${{ matrix.board }} "${mota_make_args[@]}" copy-artifact
        cmake -S . -B cmake-build-${{ matrix.board }} -DBOARD=${{ matrix.board }} \
          "${mota_cmake_args[@]}"
        cmake --build cmake-build-${{ matrix.board }}

    - name: Select normal release profile
      id: release-profile
      run: |
        python3 -c 'import sys; sys.path.insert(0, "tools"); from build_bootloader_mota_release import QUALIFIED_BOARDS, PENDING_BOARDS; print("publish=" + str(sys.argv[1] in QUALIFIED_BOARDS).lower()); print("publish_recovery=" + str(sys.argv[1] not in PENDING_BOARDS).lower())' "${{ matrix.board }}" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v7
      if: ${{ env.OTAFIX_RELEASE_BUILD != 'true' || steps.release-profile.outputs.publish == 'true' }}
      with:
        name: bootloader-${{ matrix.board }}
        path: _bin/${{ matrix.board }}
        if-no-files-found: error

    - name: Build separately labelled recovery bridge
      if: ${{ env.OTAFIX_RELEASE_BUILD == 'true' && steps.release-profile.outputs.publish_recovery == 'true' }}
      run: |
        make BOARD=${{ matrix.board }} RECOVERY_ALLOW_ALL_BOARDS=1 SECURE_DFU_TEST=0 all copy-artifact

    - uses: actions/upload-artifact@v7
      if: ${{ env.OTAFIX_RELEASE_BUILD == 'true' && steps.release-profile.outputs.publish_recovery == 'true' }}
      with:
        name: recovery-${{ matrix.board }}
        path: _bin/recovery-allow-all/${{ matrix.board }}/
        if-no-files-found: error

  feature-builds:
    if: ${{ !startsWith(github.ref_name, 'R_') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install Tools
        run: |
          pip3 install adafruit-nrfutil cryptography uritemplate requests intelhex setuptools

      - name: Run host tests
        run: |
          make -C test check
          make -C test sanitize
          python3 tools/test_otafix_mota_update.py

      - name: Build signed and dual-bank display variants
        shell: bash
        run: |
          mota_make_args=()
          mota_cmake_args=()
          if [[ "$OTAFIX_RELEASE_BUILD" != "true" ]]; then
            if [[ ! "$OTAFIX_QUALIFICATION_VERSION" =~ ^0x[0-9A-Fa-f]{8}$ || "$OTAFIX_QUALIFICATION_VERSION" == "0x02040401" ]]; then
              echo "invalid OTAFIX qualification version: $OTAFIX_QUALIFICATION_VERSION" >&2
              exit 1
            fi
            mota_make_args=(MOTA_BOOTLOADER_TEST_BUILD=1 "MOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=$OTAFIX_QUALIFICATION_VERSION")
            mota_cmake_args=(-DMOTA_BOOTLOADER_TEST_BUILD=ON "-DMOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=$OTAFIX_QUALIFICATION_VERSION")
          fi

          QX=0x6b,0x17,0xd1,0xf2,0xe1,0x2c,0x42,0x47,0xf8,0xbc,0xe6,0xe5,0x63,0xa4,0x40,0xf2,0x77,0x03,0x7d,0x81,0x2d,0xeb,0x33,0xa0,0xf4,0xa1,0x39,0x45,0xd8,0x98,0xc2,0x96
          QY=0x4f,0xe3,0x42,0xe2,0xfe,0x1a,0x7f,0x9b,0x8e,0xe7,0xeb,0x4a,0x7c,0x0f,0x9e,0x16,0x2b,0xce,0x33,0x57,0x6b,0x31,0x5e,0xce,0xcb,0xb6,0x40,0x68,0x37,0xbf,0x51,0xf5
          for board in heltec_t096 heltec_t114; do
            make BOARD="$board" RECOVERY_ALLOW_ALL_BOARDS=1 \
              "${mota_make_args[@]}" all
            cmake -S . -B "cmake-build-recovery-$board" -DBOARD="$board" \
              -DRECOVERY_ALLOW_ALL_BOARDS=ON "${mota_cmake_args[@]}"
            cmake --build "cmake-build-recovery-$board"
            make BOARD="$board" BUILD="_build/signed-$board" SIGNED_FW=1 \
              SIGNED_FW_QX="$QX" SIGNED_FW_QY="$QY" "${mota_make_args[@]}" all
            make BOARD="$board" BUILD="_build/dualbank-$board" DUALBANK_FW=1 \
              "${mota_make_args[@]}" all
            make BOARD="$board" BUILD="_build/signed-dualbank-$board" \
              SIGNED_FW=1 SIGNED_FW_QX="$QX" SIGNED_FW_QY="$QY" \
              DUALBANK_FW=1 "${mota_make_args[@]}" all

            cmake -S . -B "cmake-build-signed-$board" -DBOARD="$board" \
              -DSIGNED_FW=ON -DSIGNED_FW_QX="$QX" -DSIGNED_FW_QY="$QY" \
              "${mota_cmake_args[@]}"
            cmake --build "cmake-build-signed-$board"
            cmake -S . -B "cmake-build-dualbank-$board" -DBOARD="$board" \
              -DDUALBANK_FW=ON "${mota_cmake_args[@]}"
            cmake --build "cmake-build-dualbank-$board"
            cmake -S . -B "cmake-build-signed-dualbank-$board" -DBOARD="$board" \
              -DSIGNED_FW=ON -DSIGNED_FW_QX="$QX" -DSIGNED_FW_QY="$QY" \
              -DDUALBANK_FW=ON "${mota_cmake_args[@]}"
            cmake --build "cmake-build-signed-dualbank-$board"
          done

  bootloader-mota:
    if: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_build)) && !startsWith(github.ref_name, 'R_') }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout pinned motatool
        uses: actions/checkout@v7
        with:
          repository: mikecarper/motatool
          ref: 97431e56e1b92dc7ff9d02895366cdea48f41df4
          path: _motatool

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install firmware packaging dependencies
        run: python3 -m pip install intelhex==2.3.0

      - name: Download bootloader artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bootloader-*
          path: _release
          merge-multiple: true

      - name: Build motatool
        shell: bash
        run: |
          cargo build --release --locked --manifest-path _motatool/Cargo.toml

      - name: Build signed bootloader mOTA bundle
        shell: bash
        env:
          OTAFIX_MOTA_SIGNING_KEY: ${{ secrets.OTAFIX_MOTA_SIGNING_KEY }}
        run: |
          if [[ -z "$OTAFIX_MOTA_SIGNING_KEY" ]]; then
            echo "OTAFIX_MOTA_SIGNING_KEY repository secret is required" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/otafix-mota-signing.key"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$OTAFIX_MOTA_SIGNING_KEY" > "$key_file"
          unset OTAFIX_MOTA_SIGNING_KEY
          python3 tools/build_bootloader_mota_release.py \
            --artifacts-dir _release \
            --output-dir _mota-release \
            --motatool _motatool/target/release/motatool \
            --sign-key "$key_file" \
            --public-key tools/otafix_mota_release.pub \
            --tag "$GITHUB_REF_NAME"
          install -m 755 tools/otafix_mota_update.py \
            _mota-release/otafix_mota_update.py
          (
            cd _mota-release
            sha256sum otafix_mota_update.py > otafix_mota_update.py.sha256
          )

      - name: Upload bootloader mOTA release bundle
        uses: actions/upload-artifact@v7
        with:
          name: bootloader-mota-release
          path: |
            _mota-release/*.zip
            _mota-release/*.txt
            _mota-release/*.sha256
            _mota-release/*.py

  recovery-bundle:
    if: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_build)) && !startsWith(github.ref_name, 'R_') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: recovery-*
          path: _recovery-input
          merge-multiple: true
      - run: pip3 install intelhex
      - name: Verify and ZIP every recovery profile
        run: |
          python3 tools/build_recovery_release.py --artifacts-dir _recovery-input \
            --output-dir _recovery-release --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: bootloader-recovery-release
          path: |
            _recovery-release/*.zip
            _recovery-release/*.sha256
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'release' && !startsWith(github.ref_name, 'R_') }}
    needs: [build, feature-builds, bootloader-mota, recovery-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: _release
          pattern: bootloader-*
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            _release/*.zip
            _release/*.hex
            _release/*.uf2
            _release/*.txt
            _release/*.sha256
            _release/*.py

      - name: Label RAK4631 release profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/label_rak4631_release_assets.py \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"

      - name: Publish exact-board bootloader download manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > _release-metadata.json
          python3 tools/build_bootloader_download_manifest.py \
            --release-json _release-metadata.json --output _release/bootloader-manifest.json
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            _release/bootloader-manifest.json _release/bootloader-manifest.json.sha256

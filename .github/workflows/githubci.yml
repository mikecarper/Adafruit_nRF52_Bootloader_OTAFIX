name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master, feature/ota-delta-apply ]
  release:
    types:
      - created

permissions:
  contents: read

env:
  # 0x02040401 identifies the failed global TinyUSB-budget candidate.
  # 0x02040703 identifies post-preview.2 USB/field-kit qualification, not a release.
  OTAFIX_QUALIFICATION_VERSION: '0x02040703'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-matrix:
    if: ${{ !startsWith(github.ref_name, 'R_') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set matrix
        id: set-matrix
        working-directory: src/boards
        run: |
          MATRIX_JSON=$(ls -d */ | sed 's/\/$//' | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true

    - name: Install ARM GCC
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '14.2.Rel1'

    - name: Install Tools
      run: |
        pip3 install adafruit-nrfutil cryptography uritemplate requests intelhex setuptools

    - name: Build
      shell: bash
      run: |
        mota_make_args=()
        mota_cmake_args=()
        if [[ "$GITHUB_EVENT_NAME" != "release" ]]; then
          if [[ ! "$OTAFIX_QUALIFICATION_VERSION" =~ ^0x[0-9A-Fa-f]{8}$ || "$OTAFIX_QUALIFICATION_VERSION" == "0x02040401" ]]; then
            echo "invalid OTAFIX qualification version: $OTAFIX_QUALIFICATION_VERSION" >&2
            exit 1
          fi
          mota_make_args=(MOTA_BOOTLOADER_TEST_BUILD=1 "MOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=$OTAFIX_QUALIFICATION_VERSION")
          mota_cmake_args=(-DMOTA_BOOTLOADER_TEST_BUILD=ON "-DMOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=$OTAFIX_QUALIFICATION_VERSION")
        fi

        make BOARD=${{ matrix.board }} "${mota_make_args[@]}" all
        make BOARD=${{ matrix.board }} "${mota_make_args[@]}" copy-artifact
        cmake -S . -B cmake-build-${{ matrix.board }} -DBOARD=${{ matrix.board }} \
          "${mota_cmake_args[@]}"
        cmake --build cmake-build-${{ matrix.board }}

    - uses: actions/upload-artifact@v7
      with:
        name: bootloader-${{ matrix.board }}
        path: _bin/${{ matrix.board }}
        if-no-files-found: error

  feature-builds:
    if: ${{ !startsWith(github.ref_name, 'R_') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Install Tools
        run: |
          pip3 install adafruit-nrfutil cryptography uritemplate requests intelhex setuptools

      - name: Run host tests
        run: |
          make -C test check
          make -C test sanitize
          python3 tools/test_otafix_mota_update.py

      - name: Build signed and dual-bank display variants
        shell: bash
        run: |
          mota_make_args=()
          mota_cmake_args=()
          if [[ "$GITHUB_EVENT_NAME" != "release" ]]; then
            if [[ ! "$OTAFIX_QUALIFICATION_VERSION" =~ ^0x[0-9A-Fa-f]{8}$ || "$OTAFIX_QUALIFICATION_VERSION" == "0x02040401" ]]; then
              echo "invalid OTAFIX qualification version: $OTAFIX_QUALIFICATION_VERSION" >&2
              exit 1
            fi
            mota_make_args=(MOTA_BOOTLOADER_TEST_BUILD=1 "MOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=$OTAFIX_QUALIFICATION_VERSION")
            mota_cmake_args=(-DMOTA_BOOTLOADER_TEST_BUILD=ON "-DMOTA_BOOTLOADER_VERSION_TEST_OVERRIDE=$OTAFIX_QUALIFICATION_VERSION")
          fi

          QX=0x6b,0x17,0xd1,0xf2,0xe1,0x2c,0x42,0x47,0xf8,0xbc,0xe6,0xe5,0x63,0xa4,0x40,0xf2,0x77,0x03,0x7d,0x81,0x2d,0xeb,0x33,0xa0,0xf4,0xa1,0x39,0x45,0xd8,0x98,0xc2,0x96
          QY=0x4f,0xe3,0x42,0xe2,0xfe,0x1a,0x7f,0x9b,0x8e,0xe7,0xeb,0x4a,0x7c,0x0f,0x9e,0x16,0x2b,0xce,0x33,0x57,0x6b,0x31,0x5e,0xce,0xcb,0xb6,0x40,0x68,0x37,0xbf,0x51,0xf5
          for board in heltec_t096 heltec_t114; do
            make BOARD="$board" RECOVERY_ALLOW_ALL_BOARDS=1 \
              "${mota_make_args[@]}" all
            cmake -S . -B "cmake-build-recovery-$board" -DBOARD="$board" \
              -DRECOVERY_ALLOW_ALL_BOARDS=ON "${mota_cmake_args[@]}"
            cmake --build "cmake-build-recovery-$board"
            make BOARD="$board" BUILD="_build/signed-$board" SIGNED_FW=1 \
              SIGNED_FW_QX="$QX" SIGNED_FW_QY="$QY" "${mota_make_args[@]}" all
            make BOARD="$board" BUILD="_build/dualbank-$board" DUALBANK_FW=1 \
              "${mota_make_args[@]}" all
            make BOARD="$board" BUILD="_build/signed-dualbank-$board" \
              SIGNED_FW=1 SIGNED_FW_QX="$QX" SIGNED_FW_QY="$QY" \
              DUALBANK_FW=1 "${mota_make_args[@]}" all

            cmake -S . -B "cmake-build-signed-$board" -DBOARD="$board" \
              -DSIGNED_FW=ON -DSIGNED_FW_QX="$QX" -DSIGNED_FW_QY="$QY" \
              "${mota_cmake_args[@]}"
            cmake --build "cmake-build-signed-$board"
            cmake -S . -B "cmake-build-dualbank-$board" -DBOARD="$board" \
              -DDUALBANK_FW=ON "${mota_cmake_args[@]}"
            cmake --build "cmake-build-dualbank-$board"
            cmake -S . -B "cmake-build-signed-dualbank-$board" -DBOARD="$board" \
              -DSIGNED_FW=ON -DSIGNED_FW_QX="$QX" -DSIGNED_FW_QY="$QY" \
              -DDUALBANK_FW=ON "${mota_cmake_args[@]}"
            cmake --build "cmake-build-signed-dualbank-$board"
          done

  field-firmware:
    if: ${{ !startsWith(github.ref_name, 'R_') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout pinned USB-fixed MeshCore field firmware
        uses: actions/checkout@v7
        with:
          repository: mikecarper/MeshCore
          ref: 602dbfe3d9ad43630d9b4b6e8d9b6a73f4bc48b8
          path: _meshcore

      - name: Set up PlatformIO
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PlatformIO and firmware build dependencies
        run: python3 -m pip install platformio==6.1.19 intelhex==2.3.0

      - name: Verify pinned USB backport
        working-directory: _meshcore
        run: |
          git config core.abbrev 8
          test "$(git rev-parse HEAD)" = 602dbfe3d9ad43630d9b4b6e8d9b6a73f4bc48b8
          test "$(git rev-parse --short HEAD)" = 602dbfe3
          python3 -B test/test_nrf52_usb_power.py -v

      # Keep PlatformIO sequential: it shares and can clean its build tree.
      - name: Build phone sources and the USB-fixed receiver prerequisite
        working-directory: _meshcore
        env:
          FIRMWARE_VERSION: v1.17.1-dev
        run: |
          mkdir -p ../_field-deps
          for target in Xiao_nrf52_companion_radio_full \
                        GAT562_30S_Mesh_Kit_companion_radio_full \
                        GAT562_30S_Mesh_Kit_repeater_lora_ota_no_external_sensors; do
            bash build.sh build-firmware "$target"
            install -m 644 out/"$target"-*.uf2 out/"$target"-*.zip \
              out/"$target"-*.capabilities.json ../_field-deps/
          done

      - name: Validate images and record pinned-source provenance
        run: python3 tools/check_field_firmware.py --artifacts-dir _field-deps

      - uses: actions/upload-artifact@v7
        with:
          name: field-firmware
          path: _field-deps/
          if-no-files-found: error

  bootloader-mota:
    if: ${{ github.event_name == 'release' && !startsWith(github.ref_name, 'R_') }}
    needs: [build, field-firmware]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout pinned motatool
        uses: actions/checkout@v7
        with:
          repository: mikecarper/motatool
          ref: 9eef6e53173317f63d8cd6e61fb4f70b20129ab0
          path: _motatool

      - name: Checkout pinned MeshCore Open field app
        uses: actions/checkout@v7
        with:
          repository: mikecarper/meshcore-open
          ref: 40e440e7d5c3cbc925b7701225ea1f023b0d9ae7
          path: _meshcore-open

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install firmware packaging dependencies
        run: python3 -m pip install intelhex==2.3.0

      - name: Download bootloader artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bootloader-*
          path: _release
          merge-multiple: true

      - name: Download qualified field firmware
        uses: actions/download-artifact@v8
        with:
          name: field-firmware
          path: _field-deps

      - name: Recheck field firmware provenance and checksums
        run: python3 tools/check_field_firmware.py --artifacts-dir _field-deps --verify

      - name: Build motatool
        shell: bash
        run: |
          cargo build --release --locked --manifest-path _motatool/Cargo.toml

      - name: Build isolated Android field app
        shell: bash
        working-directory: _meshcore-open
        run: |
          flutter pub get
          flutter test \
            test/services/ble_mota_catalog_test.dart \
            test/services/lora_ota_bootloader_install_test.dart \
            test/screens/lora_ota_screen_test.dart
          sed -i \
            's/applicationId = "com.meshcore.meshcore_open"/applicationId = "com.meshcore.meshcore_open.otafixfield"/' \
            android/app/build.gradle.kts
          sed -i \
            's/android:label="MeshCore Open"/android:label="MeshCore Open OTAFIX Field"/' \
            android/app/src/main/AndroidManifest.xml
          sed -i '/^        ndk {$/,/^        }$/d' \
            android/app/build.gradle.kts
          grep -F 'applicationId = "com.meshcore.meshcore_open.otafixfield"' \
            android/app/build.gradle.kts
          grep -F 'android:label="MeshCore Open OTAFIX Field"' \
            android/app/src/main/AndroidManifest.xml
          ! grep -F 'abiFilters' android/app/build.gradle.kts
          flutter build apk --release --no-pub --split-per-abi \
            --build-name 9.5.1 --build-number 17
          mkdir -p ../_field-deps
          install -m 644 \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            ../_field-deps/MeshCore-Open-9.5.1-OTAFIX-field-arm64.apk
          mapfile -t apk_abis < <(
            unzip -Z1 \
              ../_field-deps/MeshCore-Open-9.5.1-OTAFIX-field-arm64.apk \
              | sed -n 's#^lib/\([^/]*\)/.*#\1#p' \
              | sort -u
          )
          test "${apk_abis[*]}" = "arm64-v8a"
          apksigner=$(
            find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner \
              | sort -V \
              | tail -n 1
          )
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs \
            ../_field-deps/MeshCore-Open-9.5.1-OTAFIX-field-arm64.apk

      - name: Build signed bootloader mOTA bundle
        shell: bash
        env:
          OTAFIX_MOTA_SIGNING_KEY: ${{ secrets.OTAFIX_MOTA_SIGNING_KEY }}
        run: |
          if [[ -z "$OTAFIX_MOTA_SIGNING_KEY" ]]; then
            echo "OTAFIX_MOTA_SIGNING_KEY repository secret is required" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/otafix-mota-signing.key"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$OTAFIX_MOTA_SIGNING_KEY" > "$key_file"
          unset OTAFIX_MOTA_SIGNING_KEY
          python3 tools/build_bootloader_mota_release.py \
            --artifacts-dir _release \
            --output-dir _mota-release \
            --motatool _motatool/target/release/motatool \
            --sign-key "$key_file" \
            --public-key tools/otafix_mota_release.pub \
            --tag "$GITHUB_REF_NAME"
          install -m 755 tools/otafix_mota_update.py \
            _mota-release/otafix_mota_update.py
          (
            cd _mota-release
            sha256sum otafix_mota_update.py > otafix_mota_update.py.sha256
          )
          python3 tools/build_gat562_field_kit.py \
            --release-dir _mota-release \
            --android-apk \
              _field-deps/MeshCore-Open-9.5.1-OTAFIX-field-arm64.apk \
            --xiao-companion-uf2 \
              _field-deps/Xiao_nrf52_companion_radio_full-v1.17.1-dev-602dbfe3.uf2 \
            --xiao-companion-zip \
              _field-deps/Xiao_nrf52_companion_radio_full-v1.17.1-dev-602dbfe3.zip \
            --xiao-companion-capabilities \
              _field-deps/Xiao_nrf52_companion_radio_full-v1.17.1-dev-602dbfe3.capabilities.json \
            --gat562-source-uf2 \
              _field-deps/GAT562_30S_Mesh_Kit_companion_radio_full-v1.17.1-dev-602dbfe3.uf2 \
            --gat562-source-zip \
              _field-deps/GAT562_30S_Mesh_Kit_companion_radio_full-v1.17.1-dev-602dbfe3.zip \
            --gat562-source-capabilities \
              _field-deps/GAT562_30S_Mesh_Kit_companion_radio_full-v1.17.1-dev-602dbfe3.capabilities.json \
            --gat562-receiver-uf2 \
              _field-deps/GAT562_30S_Mesh_Kit_repeater_lora_ota_no_external_sensors-ota-v1.17.1-dev-602dbfe3.uf2 \
            --gat562-receiver-zip \
              _field-deps/GAT562_30S_Mesh_Kit_repeater_lora_ota_no_external_sensors-ota-v1.17.1-dev-602dbfe3.zip \
            --gat562-receiver-capabilities \
              _field-deps/GAT562_30S_Mesh_Kit_repeater_lora_ota_no_external_sensors-ota-v1.17.1-dev-602dbfe3.capabilities.json \
            --tag "$GITHUB_REF_NAME"

      - name: Upload bootloader mOTA release bundle
        uses: actions/upload-artifact@v7
        with:
          name: bootloader-mota-release
          path: |
            _mota-release/*.zip
            _mota-release/*.txt
            _mota-release/*.sha256
            _mota-release/*.py

  release:
    if: ${{ github.event_name == 'release' && !startsWith(github.ref_name, 'R_') }}
    needs: [build, feature-builds, field-firmware, bootloader-mota]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: _release
          pattern: bootloader-*
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            _release/*.zip
            _release/*.hex
            _release/*.uf2
            _release/*.txt
            _release/*.sha256
            _release/*.py
